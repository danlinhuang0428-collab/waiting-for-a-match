<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="description" content="A 30-second story about waiting for a match." />
    <title>Waiting for a Match</title>
    <style>
:root {
  color-scheme: light;
  --ink: #24242b;
  --paper: #fffefa;
  --pink: #d60070;
  --pink-light: #ffe2ef;
  --teal: #007f79;
  --purple: #7762bd;
}

* { box-sizing: border-box; }
html { min-width: 280px; background: #f7f5f1; }
body { margin: 0; color: var(--ink); font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, a { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: progress; opacity: .7; }
a { text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--purple); outline-offset: 4px; }

.app-shell { width: 100%; max-width: 460px; min-height: 100dvh; margin: 0 auto; background: var(--paper); }
.topbar { display: flex; align-items: center; height: 58px; padding: 0 24px; border-bottom: 1px solid #e9e5df; }
.brand { display: flex; align-items: baseline; gap: 9px; white-space: nowrap; }
.brand__press { font: 700 27px/1 Georgia, 'Times New Roman', serif; letter-spacing: -.07em; }
.brand__period { color: var(--pink); }
.brand__cross { color: #77747b; font-size: 17px; }
.brand__nmdp { font-size: 14px; font-weight: 900; letter-spacing: -.045em; }

.screen { min-height: calc(100dvh - 58px); padding: 24px 24px max(24px, env(safe-area-inset-bottom)); }
.screen--story { display: flex; flex-direction: column; }
.eyebrow { margin: 0; color: #42434b; font-size: 10px; font-weight: 800; letter-spacing: .13em; }
h1, h2, p { margin-top: 0; }
.story-intro h1 { margin: 12px 0 20px; font-size: clamp(25px, 7.2vw, 34px); line-height: 1.1; letter-spacing: -.055em; }
.story-intro h1 em { color: var(--pink); font-family: Georgia, 'Times New Roman', serif; font-size: 1.03em; font-weight: 400; letter-spacing: -.055em; }
.story-player { width: 100%; }
.story-frame { position: relative; overflow: hidden; width: 100%; aspect-ratio: 1 / .94; border-radius: 20px; background: #f4dfe7; }
.story-frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
.story-frame__caption { position: absolute; right: 12px; bottom: 12px; left: 12px; padding: 12px 14px; border-radius: 12px; background: var(--paper); font: 700 clamp(16px, 4.7vw, 20px)/1.14 Georgia, 'Times New Roman', serif; letter-spacing: -.025em; }
.player-meta { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 16px; }
.player-meta h2 { margin: 0 0 5px; font-size: 22px; line-height: 1.05; letter-spacing: -.045em; }
.fictional-label { color: #5d5b62; font-size: 12px; font-weight: 400; letter-spacing: 0; }
.player-meta p { max-width: 285px; margin: 0; color: #44434a; font-size: 13px; line-height: 1.35; }
.icon-button { display: grid; flex: none; place-items: center; width: 42px; height: 42px; border: 1.5px solid var(--ink); border-radius: 50%; background: transparent; color: var(--ink); font-size: 20px; font-weight: 700; }
.icon-button:hover { background: var(--pink-light); }
.progress-block { margin-top: 19px; }
.progress-track { height: 6px; overflow: hidden; border-radius: 99px; background: #e4e3df; }
.progress-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--pink); }
.time-row { display: flex; justify-content: space-between; margin-top: 7px; color: #5a5960; font-size: 11px; font-weight: 700; }
.story-actions { display: flex; flex-direction: column; align-items: stretch; margin-top: auto; padding-top: 18px; }

.button { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 52px; padding: 12px 18px; border: 2px solid transparent; border-radius: 12px; font-size: 13px; font-weight: 900; letter-spacing: .035em; text-align: left; transition: background-color .15s ease; }
.button span { font-size: 20px; font-weight: 400; line-height: 1; }
.button--pink { background: var(--pink); color: white; }
.button--pink:hover { background: #b90060; }
.button--outline { border-color: var(--teal); background: transparent; color: #075e59; }
.button--outline:hover { background: #e4f4f0; }
.text-button, .back-button { width: fit-content; border: 0; background: none; color: var(--ink); font-weight: 700; }
.text-button { align-self: center; min-height: 38px; padding: 8px 10px; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
.text-button span { margin-left: 5px; }
.back-button { min-height: 32px; padding: 5px 0; font-size: 12px; }
.back-button span { padding-right: 5px; font-size: 17px; }

.screen--choice { padding-top: 18px; }
.screen--choice h1 { margin: clamp(54px, 12vh, 96px) 0 34px; font-size: clamp(38px, 10vw, 48px); line-height: 1; letter-spacing: -.065em; }
form label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 800; }
form input { display: block; width: 100%; height: 52px; padding: 0 14px; border: 1.5px solid #77747b; border-radius: 11px; background: white; color: var(--ink); font-size: 15px; }
form input::placeholder { color: #69676f; opacity: 1; }
form input[aria-invalid='true'] { border-color: #b00045; }
form .button { margin-top: 12px; }
.error-message { margin: 8px 0 0; color: #a50040; font-size: 12px; font-weight: 700; }
.email-result { min-height: 128px; margin: 0; padding: 38px 16px; border-radius: 12px; background: #e4f4f0; color: #075e59; font-size: 16px; font-weight: 700; line-height: 1.35; }
.divider { display: flex; align-items: center; gap: 14px; margin: 28px 0; color: #6a686c; font-size: 11px; font-weight: 800; letter-spacing: .1em; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #d8d5d2; }

@media (max-width: 360px) {
  .topbar { padding-right: 18px; padding-left: 18px; }
  .screen { padding-right: 18px; padding-left: 18px; }
  .story-intro h1 { font-size: 25px; }
  .story-frame { aspect-ratio: 1 / .84; }
  .screen--choice h1 { font-size: 38px; }
}

@media (max-height: 690px) {
  .screen--story { padding-top: 15px; }
  .story-intro h1 { margin: 8px 0 13px; }
  .story-frame { aspect-ratio: 1 / .78; }
  .player-meta { padding-top: 11px; }
  .progress-block { margin-top: 12px; }
  .story-actions { padding-top: 9px; }
  .screen--choice h1 { margin-top: 48px; margin-bottom: 25px; }
  .divider { margin: 20px 0; }
}

@media (min-width: 700px) {
  body { min-height: 100vh; background: #f3f0eb; }
  .app-shell { box-shadow: 0 0 0 1px #e2ddd6; }
  .story-intro h1 { font-size: 33px; }
  .screen--choice h1 { font-size: 48px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

</style>

const screens = {
  story: document.getElementById("story-screen"),
  choice: document.getElementById("choice-screen")
};

const art = document.getElementById("story-art");
const caption = document.getElementById("scene-caption");
const progress = document.getElementById("story-progress");
const progressFill = document.getElementById("progress-fill");
const elapsedTime = document.getElementById("elapsed-time");
const remainingTime = document.getElementById("remaining-time");
const playPause = document.getElementById("play-pause");
const playPauseIcon = document.getElementById("play-pause-icon");
const continueStory = document.getElementById("continue-story");
const skipStory = document.getElementById("skip-story");
const emailForm = document.getElementById("email-form");
const emailInput = document.getElementById("email");
const emailError = document.getElementById("email-error");
const emailSubmit = document.getElementById("email-submit");
const emailResult = document.getElementById("email-result");

let currentScreen = "story";
let elapsed = 0;
let playing = true;
let completed = false;
let lastTick = performance.now();
let submitTimer;

function showScreen(name) {
  currentScreen = name;
  Object.entries(screens).forEach(([key, element]) => { element.hidden = key !== name; });
  window.scrollTo({ top: 0, behavior: "auto" });
  const heading = screens[name].querySelector("h1");
  if (heading) {
    heading.setAttribute("tabindex", "-1");
    heading.focus({ preventScroll: true });
  }
}

function renderStory() {
  const wholeSeconds = Math.min(STORY_LENGTH, Math.floor(elapsed));
  const sceneIndex = Math.min(2, Math.floor(wholeSeconds / 10));
  const scene = scenes[sceneIndex];
  if (art.getAttribute("src") !== scene.image) {
    art.src = scene.image;
    art.alt = scene.alt;
    caption.textContent = scene.caption;
  }
  progress.setAttribute("aria-valuenow", String(wholeSeconds));
  progressFill.style.width = `${(elapsed / STORY_LENGTH) * 100}%`;
  elapsedTime.textContent = `0:${String(wholeSeconds).padStart(2, "0")}`;
  remainingTime.textContent = completed ? "Story complete" : `0:${String(STORY_LENGTH - wholeSeconds).padStart(2, "0")} left`;
  playPause.hidden = completed;
  playPauseIcon.textContent = playing ? "Ⅱ" : "▶";
  playPause.setAttribute("aria-label", playing ? "Pause story" : "Play story");
  playPause.title = playing ? "Pause story" : "Play story";
  continueStory.hidden = !completed;
  skipStory.hidden = completed;
}

function tick(now) {
  const delta = Math.min((now - lastTick) / 1000, 0.25);
  lastTick = now;
  if (currentScreen === "story" && playing && !completed && !document.hidden) {
    elapsed = Math.min(STORY_LENGTH, elapsed + delta);
    if (elapsed >= STORY_LENGTH) {
      completed = true;
      playing = false;
    }
    renderStory();
  }
  requestAnimationFrame(tick);
}

function restart() {
  clearTimeout(submitTimer);
  elapsed = 0;
  playing = true;
  completed = false;
  emailInput.value = "";
  emailInput.removeAttribute("aria-invalid");
  emailError.hidden = true;
  emailForm.hidden = false;
  emailResult.hidden = true;
  emailSubmit.disabled = false;
  emailSubmit.innerHTML = 'KEEP ME INFORMED <span aria-hidden="true">→</span>';
  art.src = scenes[0].image;
  art.alt = scenes[0].alt;
  caption.textContent = scenes[0].caption;
  renderStory();
  showScreen("story");
}

function validateEmail(value) {
  const email = value.trim();
  return email.length <= 254 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
}

playPause.addEventListener("click", () => { playing = !playing; renderStory(); });
continueStory.addEventListener("click", () => showScreen("choice"));
skipStory.addEventListener("click", () => { playing = false; renderStory(); showScreen("choice"); });
document.getElementById("choice-back").addEventListener("click", restart);

emailInput.addEventListener("input", () => {
  if (!emailError.hidden) {
    emailError.hidden = true;
    emailInput.removeAttribute("aria-invalid");
  }
});

emailForm.addEventListener("submit", event => {
  event.preventDefault();
  if (!validateEmail(emailInput.value)) {
    emailError.textContent = emailInput.value.trim() ? "Please enter a valid email address." : "Please enter your email address.";
    emailError.hidden = false;
    emailInput.setAttribute("aria-invalid", "true");
    emailInput.focus();
    return;
  }
  emailError.hidden = true;
  emailInput.removeAttribute("aria-invalid");
  emailSubmit.disabled = true;
  emailSubmit.textContent = "SUBMITTING…";
  // Prototype only: no request, storage, analytics, or logging of the entered address.
  submitTimer = setTimeout(() => {
    emailInput.value = "";
    emailForm.hidden = true;
    emailResult.hidden = false;
    emailResult.focus({ preventScroll: true });
  }, 900);
});

document.addEventListener("visibilitychange", () => { lastTick = performance.now(); });
renderStory();
requestAnimationFrame(tick);

</script>
